name: TertiaryCourses
options:
  bundleIdPrefix: com.tertiaryinfotech
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: GU9WTSTX9M
    MARKETING_VERSION: "1.10"
    CURRENT_PROJECT_VERSION: "11"
    SWIFT_VERSION: "5.0"
targets:
  TertiaryCourses:
    type: application
    platform: iOS
    sources:
      - path: TertiaryCoursesApp
        excludes:
          - Catalog.json
      - path: TertiaryCoursesApp/Catalog.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tertiaryinfotech.tertiarycoursesapp
        PRODUCT_NAME: TC LMS SG
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
    info:
      path: TertiaryCoursesApp/Info.plist
      properties:
        CFBundleDisplayName: TC LMS SG
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCalendarsWriteOnlyAccessUsageDescription: Adds your class days to your calendar when you tap "Add My Classes to Calendar".
